var KKM_N = 202;
var KKM_IDX = {}; KKM_SCHEMA.forEach(function (c, i) { KKM_IDX[c.k] = i; });

/* ===== Logik klinikal dikongsi ===== */
function num(v) { if (v === '' || v == null) return null; var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function r1(n) { return Math.round(n * 10) / 10; }
function r2(n) { return Math.round(n * 100) / 100; }
function bmiOf(berat, tinggi) { var b = num(berat), t = num(tinggi); if (!b || !t) return null; return r1(b / Math.pow(t / 100, 2)); }

function katBmi(bmi) {
  if (bmi == null) return '';

  if (bmi < 23) return 'NORMAL';
  if (bmi < 27.5) return 'OVERWEIGHT';
  if (bmi < 32.5) return 'OBES I';
  if (bmi < 37.5) return 'OBES II';

function umurDari(tl) { var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(tl || ''); if (!m) return null; var d = new Date(+m[3], +m[2] - 1, +m[1]), n = new Date(); var u = n.getFullYear() - d.getFullYear(); if (n.getMonth() < d.getMonth() || (n.getMonth() == d.getMonth() && n.getDate() < d.getDate())) u--; return u; }
/* Kira semua lajur 'calc' dalam rekod (objek kunci→nilai) */
function kiraKkm(o) {
  var t = o.B_TINGGI;
  [['B_', 'B_BERAT'], ['F6_', 'F6_BERAT'], ['F12_', 'F12_BERAT']].forEach(function (p) {
    var b = bmiOf(o[p[1]], t); if (b != null) { o[p[0] + 'BMI'] = String(b); o[p[0] + 'KATBMI'] = katBmi(b); }

  if (!num(o.UMUR) && o.TARIKH_LAHIR) { var u = umurDari(o.TARIKH_LAHIR); if (u != null) o.UMUR = String(u); }

  function beza(p, a, b) {

    function d(x, y, rev) { var u = num(o[a + x]), v = num(o[b + y]); if (u == null || v == null) return TB; return String(r2(rev ? u - v : v - u)); }

/* ---- Carta garis SVG ---- */
function carta(series, o) {
  o = o || {}; var W = 760, H = o.h || 260, pl = 44, pr = 16, pt = 14, pb = 30, all = [];
  series.forEach(function (s) { s.pts.forEach(function (p) { all.push(p); }); });
  (o.hl || []).forEach(function (h) { all.push([null, h.v]); });
  var ts = all.filter(function (p) { return p[0] != null; }).map(function (p) { return p[0]; });

  var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts); if (t1 - t0 < 864e5 * 14) { t0 -= 864e5 * 7; t1 += 864e5 * 7; }
  var vs = all.map(function (p) { return p[1]; }), v0 = Math.min.apply(null, vs), v1 = Math.max.apply(null, vs), pad = Math.max((v1 - v0) * 0.12, 1); v0 -= pad; v1 += pad;

  var g = '', st = (v1 - v0) / 4;

  var bulan = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'], d = new Date(t0); d.setDate(1); d.setMonth(d.getMonth() + 1);
  var langkah = Math.max(1, Math.ceil((t1 - t0) / (30.44 * 864e5) / 8));
  for (; d.getTime() <= t1; d.setMonth(d.getMonth() + langkah)) g += '<text x="' + X(d.getTime()) + '" y="' + (H - 10) + '" font-size="11" text-anchor="middle" fill="#6b7f84">' + bulan[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) + '</text>';
  (o.hl || []).forEach(function (h) { g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(h.v) + '" y2="' + Y(h.v) + '" stroke="' + h.c + '" stroke-dasharray="5 4"/><text x="' + (W - pr) + '" y="' + (Y(h.v) - 4) + '" font-size="11" text-anchor="end" fill="' + h.c + '">' + esc(h.l) + '</text>'; });
  series.forEach(function (s) {
    var p = s.pts.slice().sort(function (a, b) { return a[0] - b[0]; });
    if (s.line !== false && p.length > 1) g += '<polyline fill="none" stroke="' + s.c + '" stroke-width="2.2" points="' + p.map(function (q) { return X(q[0]) + ',' + Y(q[1]); }).join(' ') + '"/>';
    p.forEach(function (q) { g += '<circle cx="' + X(q[0]) + '" cy="' + Y(q[1]) + '" r="' + (s.r || 3.5) + '" fill="' + (s.hollow ? '#fff' : s.c) + '" stroke="' + s.c + '" stroke-width="1.6"><title>' + dateToDmy(new Date(q[0])) + ': ' + q[1] + '</title></circle>'; });
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>';
}

      ['diet', 'gaya', 'sosial', 'emosi'].map(function (k) { var r = (str.data.rows || {})[k] || {}; return '<tr><td>' + esc(r.halangan) + '</td><td>' + esc(r.punca) + '</td><td>' + esc(r.strategi) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="sub">Belum diisi.</p>') + '</div>' +

/* ---- Tab: Data KKM ---- */
function tabKkm() {

  var buka = { 'Fasiliti': 1, 'Pesakit': 1, 'Baseline': 1 };

    (S.cur.baru ? '' : '<button class="btn" id="f6">Isi 6 bulan dari lawatan</button><button class="btn" id="f12">Isi 12 bulan dari lawatan</button><button class="btn" id="bEx1">⬇ Eksport baris KKM</button>') +

    groups.map(function (G) {
      return '<details class="sec"' + (buka[G.g] || (S.cur.baru && /Sejarah|Rujukan/.test(G.g)) ? ' open' : '') + '><summary>' + esc(G.g) + ' <span class="sub" style="font-weight:400;margin-left:auto;margin-right:8px">' + G.f.filter(function (c) { return k[c.k]; }).length + '/' + G.f.length + '</span></summary><div class="fgrid">' +
        G.f.map(function (c) {
          var v = k[c.k] || '', id = 'k_' + c.k, inp;
          if (c.t === 'calc' || c.t === 'ro') inp = '<input readonly id="' + id + '" data-k="' + c.k + '" value="' + esc(v) + '">';
          else if (c.t === 'date') inp = '<input type="date" id="' + id + '" data-k="' + c.k + '" data-date="1" value="' + dmyToIso(v) + '">';
          else if (c.o) inp = '<input id="' + id + '" data-k="' + c.k + '" list="dl_' + c.k + '" value="' + esc(v) + '"><datalist id="dl_' + c.k + '">' + c.o.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</datalist>';
          else inp = '<input ' + (c.t === 'num' ? 'type="number" step="any" ' : '') + 'id="' + id + '" data-k="' + c.k + '" value="' + esc(v) + '">';
          return '<div class="' + (c.t === 'calc' ? 'calc' : '') + '"><label for="' + id + '">' + (KKM_IDX[c.k] + 1) + '. ' + esc(c.l) + '</label>' + inp + '</div>';
        }).join('') + '</div></details>';
    }).join('');
  function baca() { var o = Object.assign({}, k); $$('[data-k]', $('#tabc')).forEach(function (i) { o[i.dataset.k] = i.dataset.date ? isoToDmy(i.value) : i.value.trim(); }); return o; }
  function tulisCalc(o) { KKM_SCHEMA.forEach(function (c) { if (c.t === 'calc') { var el = $('#k_' + c.k); if (el) el.value = o[c.k] || ''; } }); }
  $('#tabc').addEventListener('change', function () { var o = kiraKkm(baca()); tulisCalc(o); });
  if (!S.cur.baru) {
    $('#f6').onclick = function () { susulan(6); }; $('#f12').onclick = function () { susulan(12); };
    $('#bEx1').onclick = function () { modalEksport([k.MIMO_ID], k.NAMA); };

  function susulan(b) {
    var o = baca(), t = isiSusulan(o, S.cur.lawatan, b);
    if (!t) return toast('Tiada lawatan dalam ±60 hari dari tarikh ' + b + ' bulan');
    KKM_SCHEMA.forEach(function (c) { var el = $('#k_' + c.k); if (el && c.k.indexOf(b == 6 ? 'F6_' : 'F12_') === 0) el.value = el.dataset.date ? dmyToIso(o[c.k]) : (o[c.k] || ''); });
    tulisCalc(o); $$('details.sec').forEach(function (d) { if (d.textContent.indexOf(b + ' bulan') >= 0) d.open = true; });
    toast('Diisi dari lawatan ' + t.MINGGU + ' (' + t.TARIKH + '). Semak & lengkapkan keputusan makmal, kemudian Simpan.');
  }
  $('#kkmSave').onclick = function () {

    call('saveKkm', { kkm: o }).then(function (r) { toast(S.cur.baru ? 'Pesakit didaftarkan' : 'Data KKM disimpan'); bukaPesakit(r.id, S.cur.baru ? 'app' : 'kkm'); })

/* ---- Tab: App & temujanji ---- */
function pautanApp(t) { return (APP_URL || 'https://<alamat-app-pesakit>/') + '?k=' + t; }
function svgQR(text) {
  var q = new QRLib.QRCode(-1, QRLib.ECL.M); q.addData(text); q.make();
  var n = q.getModuleCount(), m = 2, s = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) s += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + (n + 2 * m) + ' ' + (n + 2 * m) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + s + '" fill="#000"/></svg>';
}
function kodPapar(t) { return String(t || '').replace(/(.{4})(?=.)/, '$1-'); }

    (APP_URL ? '' : '<div class="note" style="margin-bottom:10px">APP_URL belum ditetapkan. QR ini contoh sahaja — tetapkan APP_URL selepas app pesakit dihoskan.</div>') +
    '<div class="row"><button class="btn" id="cpL">Salin pautan</button><button class="btn" id="prC">🖨 Cetak kad akses</button><button class="btn dng" id="rsT">Jana kod baru</button></div>' +
    '<p class="sub">Pesakit imbas QR atau masukkan kod dalam app. Jana kod baru jika telefon hilang — kod lama terus tidak sah. App tidak memaparkan No. KP, telefon, sejarah perubatan atau keputusan makmal.</p>' +
    '<div class="fgrid" style="padding:6px 0 0"><div><label>Nama panggilan dalam app</label><input id="aNama" value="' + esc(a.NAMA_PANGGILAN) + '"></div><div><label>Sasaran berat (kg)</label><input id="aSas" type="number" step="any" value="' + esc(a.SASARAN_BERAT) + '"><div class="sub">5% = ' + fmt(num(k.B_BERAT) * 0.95) + ' · 10% = ' + fmt(num(k.B_BERAT) * 0.9) + '</div></div>' +
    '<div><label>Akses app</label><select id="aAkt"><option' + (a.AKTIF !== 'TIDAK' ? ' selected' : '') + '>YA</option><option' + (a.AKTIF === 'TIDAK' ? ' selected' : '') + '>TIDAK</option></select></div></div></div>' +
    '<div class="card"><b>Tarikh temujanji (dipaparkan dalam app pesakit)</b><div class="tbl-wrap" style="margin-top:10px;max-height:none"><table><thead><tr><th>Disiplin</th>' + [1, 2, 3, 4, 5, 6].map(function (s) { return '<th>Sesi ' + s + '</th>'; }).join('') + '</tr></thead><tbody>' +
    DISIPLIN.map(function (d) { return '<tr><td>' + esc(d) + '</td>' + [0, 1, 2, 3, 4, 5].map(function (s) { return '<td><input type="date" data-tj="' + esc(d) + '" data-s="' + s + '" value="' + esc((tj[d] || [])[s] || '') + '" style="min-width:130px"></td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn pri" id="aSave">Simpan tetapan app & temujanji</button></div></div></div>';
  $('#cpL').onclick = function () { navigator.clipboard.writeText(link).then(function () { toast('Pautan disalin'); }); };
  $('#rsT').onclick = function () { ask('Jana kod baru? Kod lama tidak akan berfungsi lagi.', function () { call('resetToken', { id: k.MIMO_ID }).then(function () { toast('Kod baru dijana'); bukaPesakit(k.MIMO_ID, 'app'); }).catch(gagal); }); };
  $('#prC').onclick = function () {
    $('#printCard').innerHTML = '<div style="font-weight:700;font-size:13pt">MIMO Kedah · App Rekod Saya</div><div style="font-size:9pt;margin-bottom:3mm">Jabatan Kesihatan Negeri Kedah</div><div style="display:flex;gap:4mm;align-items:center"><div style="width:32mm">' + svgQR(link) + '</div><div>Nama: <b>' + esc(a.NAMA_PANGGILAN || k.NAMA.split(' ')[0]) + '</b><br>Kod akses:<br><b style="font-size:16pt;letter-spacing:1px">' + esc(kodPapar(a.TOKEN)) + '</b></div></div>' +
      '<ol style="font-size:9pt;padding-left:5mm;margin:3mm 0 0"><li>Imbas QR dengan kamera telefon.</li><li>Tekan menu pelayar ▸ "Add to Home Screen" / "Tambah ke Skrin Utama".</li><li>Rahsiakan kod ini.</li></ol>';

/* ---------------- Import / Eksport KKM ---------------- */
function ask(msg, ok) { var m = modal('<p style="margin-top:0">' + esc(msg) + '</p><div class="row"><button class="btn pri" id="askY">Ya, teruskan</button><button class="btn" id="askN">Batal</button></div>'); m.querySelector('.card').style.maxWidth = '420px'; $('#askN', m).onclick = function () { m.remove(); }; $('#askY', m).onclick = function () { m.remove(); ok(); }; }
function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="card">' + html + '</div>'; m.onclick = function (e) { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }
function parseTSV(t) {
  var rows = [], row = [], cell = '', q = false;
  for (var i = 0; i < t.length; i++) {
    var ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
}
function modalImport() {
  var m = modal('<h3>Import dari sheet KKM MIMO</h3><ol class="sub" style="margin-top:0"><li>Buka sheet KKM, pilih baris pesakit (dari lajur A hingga lajur terakhir, <b>tanpa baris tajuk</b>) dan salin (Ctrl+C).</li><li>Tampal di bawah (Ctrl+V). Padanan dibuat ikut No. KP: pesakit sedia ada dikemas kini, yang baru didaftarkan.</li></ol>' +
    '<textarea id="imT" rows="9" placeholder="Tampal baris dari sheet KKM di sini…" style="font-family:ui-monospace,monospace;font-size:12px"></textarea><div id="imP" class="sub" style="margin:8px 0"></div>' +
    '<div class="row"><button class="btn pri" id="imGo" disabled>Import</button><button class="btn" id="imX">Tutup</button></div>');
  var rows = [];
  $('#imT', m).oninput = function () {
    rows = parseTSV(this.value).filter(function (r) { return !/^NEGERI$/i.test((r[0] || '').trim()); }).map(function (r) { r = r.slice(0, KKM_N); while (r.length < KKM_N) r.push(''); return r; });
    var sah = rows.filter(function (r) { return r[KKM_IDX.NOKP] && r[KKM_IDX.NAMA]; });
    var ada = {}; S.list.forEach(function (p) { ada[p.nokp] = 1; });
    $('#imP', m).innerHTML = rows.length ? '<b>' + rows.length + '</b> baris dikesan · ' + sah.length + ' sah (ada nama & No. KP) · ' + sah.filter(function (r) { return ada[r[KKM_IDX.NOKP]]; }).length + ' sudah wujud (akan dikemas kini)<br>Contoh: ' + sah.slice(0, 3).map(function (r) { return esc(r[KKM_IDX.NAMA]) + ' — ' + esc(r[KKM_IDX.FASILITI]); }).join('; ') : '';
    $('#imGo', m).disabled = !sah.length;
  };
  $('#imX', m).onclick = function () { m.remove(); };
  $('#imGo', m).onclick = function () {
    this.disabled = true;
    call('importKkm', { rows: rows }).then(function (r) { m.remove(); toast('Import selesai: ' + r.baru + ' baru, ' + r.kemaskini + ' dikemas kini' + (r.langkau ? ', ' + r.langkau + ' dilangkau' : '')); muatSenarai(); }).catch(gagal);
  };
}
function modalEksport(ids, label) {
  var m = modal('<h3>Eksport format KKM — ' + esc(label) + '</h3><div class="row" style="margin-bottom:8px"><label class="row" style="gap:6px"><input type="checkbox" id="exP"> Kosongkan lajur PERBEZAAN (jika sheet KKM mengira sendiri)</label><label class="row" style="gap:6px"><input type="checkbox" id="exH"> Sertakan baris tajuk</label></div>' +
    '<textarea id="exT" rows="9" readonly style="font-family:ui-monospace,monospace;font-size:12px">Memuatkan…</textarea>' +
    '<p class="sub">Tampal di lajur A pada baris kosong pertama sheet KKM. Susunan 202 lajur sama seperti sheet KKM.</p><div class="row"><button class="btn pri" id="exC">Salin ke papan klip</button><button class="btn" id="exD">Muat turun CSV</button><button class="btn" id="exX">Tutup</button></div>');
  var rows = [];
  function bina() {
    var out = rows.map(function (r) { r = r.slice(); if ($('#exP', m).checked) for (var i = KKM_IDX.P06_BERAT; i <= KKM_IDX.P012_HBA1C_ST; i++) r[i] = ''; return r; });
    if ($('#exH', m).checked) out.unshift(KKM_SCHEMA.map(function (c) { return c.g + ' | ' + c.l; }));
    return out;
  }
  function tsv() { return bina().map(function (r) { return r.map(function (c) { c = String(c); return /[\t\n"]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join('\t'); }).join('\n'); }
  function upd() { $('#exT', m).value = tsv(); }
  call('exportKkm', { ids: ids }).then(function (r) { rows = r.rows; upd(); }).catch(gagal);
  $('#exP', m).onchange = upd; $('#exH', m).onchange = upd;
  $('#exC', m).onclick = function () { navigator.clipboard.writeText(tsv()).then(function () { toast(rows.length + ' baris disalin'); }); };
  $('#exD', m).onclick = function () {
    var csv = '﻿' + bina().map(function (r) { return r.map(function (c) { c = String(c); return /[",\n]/.test(c) || /^0\d/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'MIMO_KKM_eksport_' + dmyToIso(dateToDmy(new Date())) + '.csv'; a.click();
  };
  $('#exX', m).onclick = function () { m.remove(); };
}
