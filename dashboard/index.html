<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIMO Kedah · Kad Rawatan Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5e;--blue:#2f4a9a;--brand:#3d5aa8;--sky:#8fb0e3;--ice:#eaf0fb;--bg:#f2f5fb;--card:#fff;--line:#e3e9f4;--ink:#16213f;--muted:#5f6d8c;
  --green:#1a8f62;--greenbg:#e3f6ee;--amber:#b86e00;--amberbg:#fff3df;--red:#c23a3a;--redbg:#fdeaea;--teal:#2f4a9a;--tealbg:#eaf0fb;
  --r:14px;--sh:0 1px 2px rgba(27,42,94,.05),0 6px 20px -10px rgba(27,42,94,.18);--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{font:500 14px/1.5 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9db6ee;outline-offset:1px}
/* shell */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:linear-gradient(180deg,#1b2a5e 0%,#16224d 100%);color:#fff;display:flex;flex-direction:column;padding:18px 14px;z-index:30}
.side .brand{background:#fff;border-radius:16px;padding:12px 12px 10px;text-align:center;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.side .brand img{width:132px;height:auto;display:block;margin:0 auto}
.side .sys{font-size:11.5px;color:#a9b8e2;text-align:center;margin:10px 0 16px;line-height:1.35}
.side nav{display:flex;flex-direction:column;gap:3px}
.side nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:#c8d3f0;padding:10px 12px;border-radius:11px;font-weight:600;text-align:left;cursor:pointer}
.side nav button svg{width:19px;height:19px;flex:none;opacity:.9}
.side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav button.on{background:#fff;color:var(--navy);box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.side nav .sep{height:1px;background:rgba(255,255,255,.1);margin:10px 4px}
.side .who{margin-top:auto;background:rgba(255,255,255,.06);border-radius:12px;padding:11px 12px;font-size:12px;color:#c8d3f0}
.side .who b{display:block;color:#fff;font-size:13px}
.side .who button{margin-top:9px;width:100%;border:1px solid rgba(255,255,255,.18);background:none;color:#fff;border-radius:9px;padding:7px;cursor:pointer;font-weight:600}
.mainwrap{margin-left:248px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:rgba(242,245,251,.88);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}.topbar .crumb{color:var(--muted);font-size:13px}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;background:#ffd166;color:#4a3500;font-weight:800}
main{max-width:1320px;margin:0 auto;padding:22px 28px 60px}
body.nolog .side,body.nolog .topbar{display:none}body.nolog .mainwrap{margin-left:0}body.nolog main{max-width:none;padding:0}
.burger{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;align-items:center;justify-content:center;cursor:pointer;flex:none}.burger svg{width:22px;height:22px}
.scrim{display:none}
@media(max-width:980px){.side{width:264px;transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;z-index:60;box-shadow:12px 0 40px -10px rgba(0,0,0,.4)}body.drawer .side{transform:none}body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(14,22,48,.45);z-index:50}.burger{display:inline-flex}.mainwrap{margin-left:0}.topbar{padding:10px 14px;gap:10px}.topbar h1{font-size:17px;line-height:1.25}.topbar .crumb{font-size:12px;line-height:1.3}main{padding:14px}}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr!important}.fgrid{grid-template-columns:1fr 1fr!important;padding:4px 12px 12px}.kpis{grid-template-columns:1fr 1fr;gap:10px}main table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}main th,main td{white-space:nowrap}.card{padding:14px}.pill{font-size:9.5px;padding:2px 7px}.hbar{grid-template-columns:96px 1fr 36px}.modal .card,.mdl .card{max-width:calc(100vw - 24px)!important}}
@media(max-width:420px){.fgrid{grid-template-columns:1fr!important}}
/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3,.h3{margin:0 0 4px;font-size:15px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
.btn:hover{border-color:#b8c6e4}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 14px -8px rgba(47,74,154,.8)}.btn.pri:hover{background:var(--navy)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}.btn.dng{color:var(--red)}.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fbfcff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,90,168,.15);background:#fff}
input[readonly]{background:#f2f5fa;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{display:flex;gap:14px;align-items:center}.kpi .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}.kpi .l{color:var(--muted);font-size:12.5px}
table{border-collapse:collapse;width:100%}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:#f7f9fd;position:sticky;top:0;z-index:1}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#f5f8ff}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;margin:1px 3px 1px 0;white-space:nowrap;background:#eef2f8;color:var(--muted)}
.chip.g{background:var(--greenbg);color:var(--green)}.chip.a{background:var(--amberbg);color:var(--amber)}.chip.r{background:var(--redbg);color:var(--red)}.chip.t{background:var(--ice);color:var(--blue)}
.sub{color:var(--muted);font-size:12.5px}.up{color:var(--red)}.down{color:var(--green)}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.pcell{display:flex;gap:10px;align-items:center}
.mini{height:6px;border-radius:99px;background:#edf1f8;overflow:hidden;width:90px;margin-left:auto}.mini i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5b7fe0,#1a8f62)}
.tabs{display:flex;gap:6px;margin:16px 0 18px;overflow-x:auto;background:#f2f5fb;padding:5px;border-radius:12px;border:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--muted);border-radius:9px;white-space:nowrap;font-weight:700;font-size:13px}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.hero{background:linear-gradient(120deg,#1b2a5e,#2f4a9a 60%,#4a6bc4);color:#fff;border-radius:18px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .av{width:58px;height:58px;font-size:20px;border-radius:16px;background:rgba(255,255,255,.16)}
.hero h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}.hero .meta{color:#c9d6f5;font-size:13px}
@media(max-width:760px){.hero{padding:16px;gap:12px}.hero h2{font-size:18px}.hero .av{width:46px;height:46px;font-size:16px}.hero .meta{font-size:12px}.kpi .ic{width:38px;height:38px;font-size:18px}.kpi .v{font-size:21px}.kpi{gap:10px}}
.hero .chip{background:rgba(255,255,255,.14);color:#fff}.hero .chip.a{background:#ffd166;color:#4a3500}.hero .chip.g{background:#9ff0c9;color:#0b4d34}.hero .chip.r{background:#ffb4b4;color:#6b1111}
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}.ph h2{margin:0;font-size:20px}.meta{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2>*{min-width:0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid3>*{min-width:0}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;box-shadow:var(--sh)}.tile .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}.tile .l{font-size:12px;color:var(--muted);font-weight:600}
details.sec{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:#fff}
details.sec summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.sec summary::after{content:'▾';color:var(--muted)}details.sec[open] summary::after{content:'▴'}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;padding:4px 16px 16px}
.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}.fgrid .calc input{background:var(--ice);color:var(--blue);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(15,24,55,.5);display:flex;align-items:flex-start;justify-content:center;padding:50px 16px;z-index:50;overflow:auto;backdrop-filter:blur(2px)}
.modal .card{width:min(900px,100%)}.modal h3{margin:0 0 10px;font-size:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:11px;z-index:99;font-size:13px;font-weight:600;box-shadow:0 10px 24px -8px rgba(0,0,0,.35)}
.note{background:var(--amberbg);border:1px solid #f3d7a6;color:#6b4300;border-radius:10px;padding:10px 12px;font-size:13px}
.info{background:var(--ice);border:1px solid #cfdbf5;color:#24387a;border-radius:10px;padding:10px 12px;font-size:13px}
.alert{background:var(--redbg);border:1px solid #f3c1c1;color:#7a1a1a;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.daycard{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}.daycard .hd{background:#f7f9fd;padding:8px 12px;display:flex;justify-content:space-between;font-weight:700}
.daycard td,.daycard th{padding:6px 12px;font-size:13px}
.qr svg{width:180px;height:180px;display:block}
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:13px;background:#fff}
.empty{padding:34px;text-align:center;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.hbar{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hbar .tr{height:12px;border-radius:99px;background:#eef2f8;overflow:hidden}.hbar .tr i{display:block;height:100%;border-radius:99px}
.cols{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.cols div{flex:1;text-align:center;font-size:12px;color:var(--muted);font-weight:600}.cols i{display:block;border-radius:9px 9px 4px 4px;margin:0 auto 6px;max-width:58px}.cols b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}.donut span{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center}
.donut b{font-size:24px;font-weight:800;line-height:1}
.leg{display:grid;gap:8px;font-size:13px}.leg div{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:3px}
span.c{display:inline-grid;width:24px;height:24px;border-radius:7px;place-items:center;font-size:11px;font-weight:800;vertical-align:middle}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login .l{background:radial-gradient(120% 90% at 20% 10%,#3d5aa8 0%,#1b2a5e 55%,#121d45 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px}
.login .l .lg2{background:#fff;border-radius:22px;padding:16px 18px 12px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6)}.login .l img{width:210px;display:block}
.login .l h1{font-size:34px;line-height:1.1;margin:28px 0 8px;font-weight:800;letter-spacing:-.02em}.login .l p{color:#c9d6f5;max-width:440px;margin:0}
.login .r{display:flex;align-items:center;justify-content:center;padding:40px}
.login .box{width:100%;max-width:380px}.login .box h2{margin:0 0 4px;font-size:24px;font-weight:800}
@media(max-width:860px){.login{grid-template-columns:1fr}.login .l{padding:36px 24px}.login .l img{width:150px}}
.pw{position:relative}.pw input{padding-right:42px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:8px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.pw .eye:hover{background:#eef2f8;color:var(--navy)}.pw .eye svg{width:19px;height:19px}
.lupa{border:0;background:none;color:var(--blue);font-weight:700;padding:0;cursor:pointer;font-size:12.5px}
#printCard{display:none}
@media print{body *{visibility:hidden}#printCard,#printCard *{visibility:visible}#printCard{display:block;position:absolute;left:0;top:0;width:90mm;border:1px dashed #999;padding:6mm;font-size:11pt}}
</style>

</head>

/* ---- Carta garis SVG ---- */
function carta(series, o) {
  o = o || {}; var W = 760, H = o.h || 260, pl = 44, pr = 16, pt = 14, pb = 30, all = [];
  series.forEach(function (s) { s.pts.forEach(function (p) { all.push(p); }); });
  (o.hl || []).forEach(function (h) { all.push([null, h.v]); });
  var ts = all.filter(function (p) { return p[0] != null; }).map(function (p) { return p[0]; });
  if (!ts.length) return '<div class="empty">Belum ada data untuk carta.</div>';
  var t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts); if (t1 - t0 < 864e5 * 14) { t0 -= 864e5 * 7; t1 += 864e5 * 7; }
  var vs = all.map(function (p) { return p[1]; }), v0 = Math.min.apply(null, vs), v1 = Math.max.apply(null, vs), pad = Math.max((v1 - v0) * 0.12, 1); v0 -= pad; v1 += pad;
  function X(t) { return pl + (t - t0) / (t1 - t0) * (W - pl - pr); } function Y(v) { return pt + (1 - (v - v0) / (v1 - v0)) * (H - pt - pb); }
  var g = '', st = (v1 - v0) / 4;
  for (var i = 0; i <= 4; i++) { var v = v0 + st * i; g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e7eeee"/><text x="' + (pl - 6) + '" y="' + (Y(v) + 4) + '" font-size="11" text-anchor="end" fill="#6b7f84">' + v.toFixed(0) + '</text>'; }
  var bulan = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'], d = new Date(t0); d.setDate(1); d.setMonth(d.getMonth() + 1);
  var langkah = Math.max(1, Math.ceil((t1 - t0) / (30.44 * 864e5) / 8));
  for (; d.getTime() <= t1; d.setMonth(d.getMonth() + langkah)) g += '<text x="' + X(d.getTime()) + '" y="' + (H - 10) + '" font-size="11" text-anchor="middle" fill="#6b7f84">' + bulan[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2) + '</text>';
  (o.hl || []).forEach(function (h) { g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(h.v) + '" y2="' + Y(h.v) + '" stroke="' + h.c + '" stroke-dasharray="5 4"/><text x="' + (W - pr) + '" y="' + (Y(h.v) - 4) + '" font-size="11" text-anchor="end" fill="' + h.c + '">' + esc(h.l) + '</text>'; });
  series.forEach(function (s) {
    var p = s.pts.slice().sort(function (a, b) { return a[0] - b[0]; });
    if (s.line !== false && p.length > 1) g += '<polyline fill="none" stroke="' + s.c + '" stroke-width="2.2" points="' + p.map(function (q) { return X(q[0]) + ',' + Y(q[1]); }).join(' ') + '"/>';
    p.forEach(function (q) { g += '<circle cx="' + X(q[0]) + '" cy="' + Y(q[1]) + '" r="' + (s.r || 3.5) + '" fill="' + (s.hollow ? '#fff' : s.c) + '" stroke="' + s.c + '" stroke-width="1.6"><title>' + dateToDmy(new Date(q[0])) + ': ' + q[1] + '</title></circle>'; });
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>';
}

      ['diet', 'gaya', 'sosial', 'emosi'].map(function (k) { var r = (str.data.rows || {})[k] || {}; return '<tr><td>' + esc(r.halangan) + '</td><td>' + esc(r.punca) + '</td><td>' + esc(r.strategi) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="sub">Belum diisi.</p>') + '</div>' +
    '<div class="card"><b>Refleksi mingguan</b>' + (refs.length ? refs.map(function (r) { return '<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:13px"><span class="chip t">' + esc(r.kunci) + '</span><br><b>Bila makan walaupun tak lapar:</b> ' + esc(r.data.q1) + '<br><b>Emosi pencetus:</b> ' + esc(r.data.q2) + '<br><b>Tindakan alternatif:</b> ' + esc(r.data.q3) + '</div>'; }).join('') : '<p class="sub">Belum ada.</p>') + '</div></div></div>';
}

/* ---- Tab: Data KKM ---- */
function tabKkm() {
  var k = S.cur.kkm, groups = [], gi = {}, kosong = !!S.tunjukKosong;
  KKM_SCHEMA.forEach(function (c) { if (!(c.g in gi)) { gi[c.g] = groups.length; groups.push({ g: c.g, f: [] }); } groups[gi[c.g]].f.push(c); });
  // Cadangan nilai susulan dari rekod lawatan (untuk diisi dalam Google Form KKM)
  function cadang(b) {
    var o = JSON.parse(JSON.stringify(k)), t = isiSusulan(o, S.cur.lawatan, b), P = b == 6 ? 'F6_' : 'F12_';
    if (!t) return '<div class="sub">Tiada lawatan dalam ±60 hari dari tarikh ' + b + ' bulan.</div>';
    return '<div class="sub" style="margin-bottom:6px">Dari lawatan <b>' + esc(t.MINGGU) + '</b> (' + esc(t.TARIKH) + ')</div><table><tbody>' +
      [['BERAT', 'Berat (kg)'], ['BMI', 'BMI'], ['KATBMI', 'Kategori BMI'], ['WC', 'Lilit pinggang (cm)'], ['SIS', 'BP sistolik'], ['DIA', 'BP diastolik'], ['BCA_PLEMAK', '% lemak badan'], ['BCA_VISC', 'Lemak viseral'], ['BCA_JLEMAK', 'Jisim lemak'], ['BCA_SMM', 'Jisim otot rangka']]
        .filter(function (x) { return o[P + x[0]]; }).map(function (x) { var v = o[P + x[0]], dlm = k[P + x[0]]; return '<tr><td>' + x[1] + '</td><td class="num"><b>' + esc(v) + '</b></td><td class="sub">' + (dlm ? (String(dlm) === String(v) ? '✓ sama dengan KKM' : 'KKM: ' + esc(dlm)) : '<span style="color:var(--amber)">belum dalam KKM</span>') + '</td><td><button class="btn sm" data-cp="' + esc(v) + '">Salin</button></td></tr>'; }).join('') + '</tbody></table>';
  }
  $('#tabc').innerHTML = '<div class="info" style="margin-bottom:14px">Data ini dibaca terus daripada <b>sheet KKM MIMO</b> (paparan sahaja). Untuk mengemas kini, gunakan <b>Google Form KKM</b>; perubahan akan muncul di sini selepas sheet KKM dikemas kini.</div>' +
    '<div class="grid2" style="margin-bottom:16px"><div class="card"><h3>Nilai 6 bulan untuk Google Form KKM</h3>' + cadang(6) + '</div><div class="card"><h3>Nilai 12 bulan untuk Google Form KKM</h3>' + cadang(12) + '</div></div>' +
    '<div class="row" style="margin-bottom:10px"><b class="grow">Rekod dalam sheet KKM (baris ' + esc(k._baris || '') + ')</b><label class="row sub" style="gap:6px"><input type="checkbox" id="tkK"' + (kosong ? ' checked' : '') + ' style="width:auto"> Tunjuk medan kosong</label></div>' +
    groups.map(function (G, gi2) {
      var f = G.f.filter(function (c) { return kosong || (k[c.k] && k[c.k] !== 'TIDAK BERKAITAN'); });
      if (!f.length) return '';
      return '<details class="sec"' + (gi2 < 5 ? ' open' : '') + '><summary>' + esc(G.g) + ' <span class="sub" style="font-weight:600;margin-left:auto;margin-right:8px">' + G.f.filter(function (c) { return k[c.k]; }).length + '/' + G.f.length + '</span></summary><div class="fgrid">' +
        f.map(function (c) { return '<div><label>' + (KKM_IDX[c.k] + 1) + '. ' + esc(c.l) + '</label><input readonly value="' + esc(k[c.k]) + '"></div>'; }).join('') + '</div></details>';
    }).join('');
  $('#tkK').onchange = function () { S.tunjukKosong = this.checked; tabKkm(); };
  $$('[data-cp]').forEach(function (b) { b.onclick = function () { navigator.clipboard.writeText(b.dataset.cp).then(function () { toast('Disalin: ' + b.dataset.cp); }); }; });
}
/* ---- Tab: App & temujanji ---- */
function pautanApp(t) { return (APP_URL || 'https://<alamat-app-pesakit>/') + '?k=' + t; }
function svgQR(text) {
  var q = new QRLib.QRCode(-1, QRLib.ECL.M); q.addData(text); q.make();
  var n = q.getModuleCount(), m = 2, s = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) s += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + (n + 2 * m) + ' ' + (n + 2 * m) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + s + '" fill="#000"/></svg>';
}
function kodPapar(t) { return String(t || '').replace(/(.{4})(?=.)/, '$1-'); }
function tabApp() {
  var a = S.cur.app, k = S.cur.kkm, tj = {}; try { tj = JSON.parse(a.TEMUJANJI_JSON || '{}'); } catch (e) { }
  var link = pautanApp(a.TOKEN);
  $('#tabc').innerHTML = '<div class="grid2" style="grid-template-columns:1fr 2fr"><div class="card"><b>Akses app pesakit</b>' +
    '<div class="row" style="margin:12px 0;align-items:flex-start"><div class="qr">' + svgQR(link) + '</div><div><div class="sub">Kod akses</div><div style="font-size:24px;font-weight:700;letter-spacing:2px;font-family:ui-monospace,monospace">' + esc(kodPapar(a.TOKEN)) + '</div>' +
    '<div class="sub" style="margin-top:6px;word-break:break-all">' + esc(link) + '</div></div></div>' +
    (APP_URL ? '' : '<div class="note" style="margin-bottom:10px">APP_URL belum ditetapkan. QR ini contoh sahaja — tetapkan APP_URL selepas app pesakit dihoskan.</div>') +
    '<div class="row"><button class="btn" id="cpL">Salin pautan</button><button class="btn" id="prC">🖨 Cetak kad akses</button><button class="btn dng" id="rsT">Jana kod baru</button></div>' +
    '<p class="sub">Pesakit imbas QR atau masukkan kod dalam app. Jana kod baru jika telefon hilang — kod lama terus tidak sah. App tidak memaparkan No. KP, telefon, sejarah perubatan atau keputusan makmal.</p>' +
    '<div class="fgrid" style="padding:6px 0 0"><div><label>Nama panggilan dalam app</label><input id="aNama" value="' + esc(a.NAMA_PANGGILAN) + '"></div><div><label>Sasaran berat (kg)</label><input id="aSas" type="number" step="any" value="' + esc(a.SASARAN_BERAT) + '"><div class="sub">5% = ' + fmt(num(k.B_BERAT) * 0.95) + ' · 10% = ' + fmt(num(k.B_BERAT) * 0.9) + '</div></div>' +
    '<div><label>Tarikh mula program (minggu 1)</label><input type="date" id="aMula" value="' + esc(a.TARIKH_MULA || dmyToIso(k.TARIKH_DAFTAR)) + '"><div class="sub">Menentukan fasa senaman & cabaran dalam app</div></div>' +
    '<div><label>Akses app</label><select id="aAkt"><option' + (a.AKTIF !== 'TIDAK' ? ' selected' : '') + '>YA</option><option' + (a.AKTIF === 'TIDAK' ? ' selected' : '') + '>TIDAK</option></select></div></div></div>' +
    '<div class="card"><b>Tarikh &amp; masa temujanji (dipaparkan dalam app pesakit)</b><p class="sub" style="margin:4px 0 0">Masa adalah pilihan. Pesakit boleh menambah temujanji ke kalendar telefon dan menerima peringatan sehari sebelum.</p><div class="tbl-wrap" style="margin-top:10px;max-height:none"><table><thead><tr><th>Disiplin</th>' + [1, 2, 3, 4, 5, 6].map(function (s) { return '<th>Sesi ' + s + '</th>'; }).join('') + '</tr></thead><tbody>' +
    DISIPLIN.map(function (d) { return '<tr><td>' + esc(d) + '</td>' + [0, 1, 2, 3, 4, 5].map(function (s) { return (function () { var v = String((tj[d] || [])[s] || ''), dt = v.slice(0, 10), tm = v.length > 10 ? v.slice(11, 16) : ''; return '<td><input type="date" data-tj="' + esc(d) + '" data-s="' + s + '" value="' + esc(dt) + '" style="min-width:130px"><input type="time" data-tjm="' + esc(d) + '" data-s="' + s + '" value="' + esc(tm) + '" aria-label="Masa" style="min-width:130px;margin-top:4px"></td>'; })(); }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn pri" id="aSave">Simpan tetapan app & temujanji</button></div></div></div>';
  $('#cpL').onclick = function () { navigator.clipboard.writeText(link).then(function () { toast('Pautan disalin'); }); };
  $('#rsT').onclick = function () { ask('Jana kod baru? Kod lama tidak akan berfungsi lagi.', function () { call('resetToken', { id: k.MIMO_ID }).then(function () { toast('Kod baru dijana'); bukaPesakit(k.MIMO_ID, 'app'); }).catch(gagal); }); };
  $('#prC').onclick = function () {
    $('#printCard').innerHTML = '<div style="font-weight:700;font-size:13pt">MIMO Kedah · App Rekod Saya</div><div style="font-size:9pt;margin-bottom:3mm">Jabatan Kesihatan Negeri Kedah</div><div style="display:flex;gap:4mm;align-items:center"><div style="width:32mm">' + svgQR(link) + '</div><div>Nama: <b>' + esc(a.NAMA_PANGGILAN || k.NAMA.split(' ')[0]) + '</b><br>Kod akses:<br><b style="font-size:16pt;letter-spacing:1px">' + esc(kodPapar(a.TOKEN)) + '</b></div></div>' +
      '<ol style="font-size:9pt;padding-left:5mm;margin:3mm 0 0"><li>Imbas QR dengan kamera telefon.</li><li>Tekan menu pelayar ▸ "Add to Home Screen" / "Tambah ke Skrin Utama".</li><li>Rahsiakan kod ini.</li></ol>';
    try { window.print(); } catch (e) { toast('Cetakan tidak disokong di sini'); }
  };
  $('#aSave').onclick = function () {
    var t = {}; DISIPLIN.forEach(function (d) { t[d] = [0, 1, 2, 3, 4, 5].map(function (s) { var dt = $('[data-tj="' + d + '"][data-s="' + s + '"]').value, tm = $('[data-tjm="' + d + '"][data-s="' + s + '"]').value; return dt ? dt + (tm ? 'T' + tm : '') : ''; }); });
    call('saveApp', { app: { MIMO_ID: k.MIMO_ID, NAMA_PANGGILAN: $('#aNama').value.trim(), SASARAN_BERAT: $('#aSas').value, AKTIF: $('#aAkt').value, TARIKH_MULA: $('#aMula').value, TEMUJANJI_JSON: JSON.stringify(t) } })
      .then(function () { toast('Disimpan'); bukaPesakit(k.MIMO_ID, 'app'); }).catch(gagal);
  };
}

/* ---------------- Import / Eksport KKM ---------------- */
function ask(msg, ok) { var m = modal('<p style="margin-top:0">' + esc(msg) + '</p><div class="row"><button class="btn pri" id="askY">Ya, teruskan</button><button class="btn" id="askN">Batal</button></div>'); m.querySelector('.card').style.maxWidth = '420px'; $('#askN', m).onclick = function () { m.remove(); }; $('#askY', m).onclick = function () { m.remove(); ok(); }; }
function modal(html) { var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div class="card">' + html + '</div>'; m.onclick = function (e) { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }
/* ---------------- Tetapan ---------------- */
$('#btnSet').onclick = function () { tutupMenu();
  var m = modal('<h3>Tetapan akaun</h3><div class="fgrid" style="padding:8px 0"><div><label>Kata laluan lama</label><input type="password" id="pw0"></div><div><label>Kata laluan baru (≥8 aksara)</label><input type="password" id="pw1"></div></div>' +
    '<div class="row"><button class="btn pri" id="pwGo">Tukar kata laluan</button><button class="btn" id="stX">Tutup</button>' + (DEMO ? '<button class="btn dng" id="dmR">Set semula data demo</button>' : '') + '</div>');
  m.querySelector('.card').style.maxWidth = '560px'; mata(m);
  $('#stX', m).onclick = function () { m.remove(); };
  $('#pwGo', m).onclick = function () { call('tukarPassword', { lama: $('#pw0', m).value, baru: $('#pw1', m).value }).then(function () { toast('Kata laluan ditukar'); m.remove(); }).catch(gagal); };
  if (DEMO) $('#dmR', m).onclick = function () { GAS_EMU.reset(); m.remove(); logout(true); toast('Data demo dijana semula'); };
};
function viewPengguna() {
  S.cur = null; tajuk('Pengguna sistem', 'Tahap akses: negeri, daerah atau fasiliti', 'pengguna');
  $('#app').innerHTML = '<div class="empty">Memuatkan…</div>';
  var R = S.rujukan || { daerah: [], fasiliti: [] };
  call('senaraiPetugas').then(function (r) {
    var TC = { NEGERI: 't', DAERAH: 'a', FASILITI: 'g' };
    $('#app').innerHTML = '<div class="grid2" style="grid-template-columns:1.4fr 1fr"><div class="card"><h3>Senarai pengguna</h3><table style="margin-top:8px"><thead><tr><th>Pengguna</th><th>Tahap</th><th>Skop akses</th><th>Peranan</th></tr></thead><tbody>' +
      r.petugas.map(function (p) { return '<tr><td><div class="pcell">' + avatar(p.nama) + '<div><b>' + esc(p.nama) + '</b><div class="sub">' + esc(p.username) + (p.aktif === 'YA' ? '' : ' · tidak aktif') + '</div></div></div></td><td><span class="chip ' + TC[p.tahap] + '">' + esc(p.tahap) + '</span></td><td class="sub">' + esc(p.skop) + '</td><td class="sub">' + esc(p.peranan) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="card"><h3>Tambah atau set semula pengguna</h3><p class="sub" style="margin:0 0 10px">Nama pengguna yang sama akan dikemas kini (contohnya untuk set semula kata laluan).</p><div class="fgrid" style="padding:0;grid-template-columns:1fr 1fr">' +
      '<div><label>Nama pengguna</label><input id="nu" placeholder="cth: kkbsp1"></div><div><label>Nama penuh</label><input id="nn"></div>' +
      '<div><label>Tahap akses</label><select id="nt"><option value="FASILITI">Fasiliti (klinik)</option><option value="DAERAH">Daerah</option><option value="NEGERI">Negeri</option></select></div>' +
      '<div id="wD"><label>Daerah</label><select id="nd">' + R.daerah.map(function (d) { return '<option>' + esc(d) + '</option>'; }).join('') + '</select></div>' +
      '<div id="wF" style="grid-column:1/-1"><label>Fasiliti</label><select id="nf">' + R.fasiliti.map(function (g) { return '<optgroup label="' + esc(g.daerah) + '">' + g.fasiliti.map(function (f) { return '<option>' + esc(f) + '</option>'; }).join('') + '</optgroup>'; }).join('') + '</select></div>' +
      '<div><label>Kata laluan sementara</label><input id="np" placeholder="≥8 aksara" autocomplete="off"></div><div><label>Peranan</label><select id="nr"><option value="PETUGAS">Petugas</option><option value="ADMIN">Admin (urus pengguna)</option></select></div></div>' +
      '<div style="height:12px"></div><button class="btn pri" id="nuGo">Simpan pengguna</button><p class="sub">Senarai daerah dan fasiliti diambil daripada data KKM.<br>Pengguna lupa kata laluan? Simpan semula nama pengguna yang sama dengan kata laluan sementara baharu, kemudian minta mereka menukarnya melalui Tetapan.</p></div></div>';
    function tukar() { var t = $('#nt').value; $('#wD').hidden = t !== 'DAERAH'; $('#wF').hidden = t !== 'FASILITI'; }
    $('#nt').onchange = tukar; tukar();
    $('#nuGo').onclick = function () {
      var t = $('#nt').value;
      call('tambahPetugas', { username: $('#nu').value.trim().toLowerCase(), nama: $('#nn').value.trim(), tahap: t, daerah: t === 'DAERAH' ? $('#nd').value : '', fasiliti: t === 'FASILITI' ? $('#nf').value : '', password: $('#np').value, peranan: $('#nr').value })
        .then(function () { toast('Pengguna disimpan'); viewPengguna(); }).catch(gagal);
    };
  }).catch(gagal);
}

/* ---------------- Mula ---------------- */
(function () {
  $('#demoPill').hidden = !DEMO;
  try { var s = JSON.parse(sessionStorage.getItem('mimo_s') || 'null'); if (s) { S.sess = s.s; S.user = s.u; } } catch (e) { }
  chrome();
  if (S.sess) muatSenarai(); else viewLogin();
})();
</script>
