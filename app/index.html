<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIMO Saya">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>MIMO Saya</title>
<style>
:root{
  --plum:#1b2a5e;--plum2:#2f4a9a;--ink:#16213f;--soft:#62708f;--line:#e2e8f4;--bg:#f3f6fc;--card:#fff;
  --pandan:#22b07d;--mango:#ffb627;--chilli:#ff5a5f;--lilac:#5b7fe0;--sky:#3fa7f5;
  --r-xl:30px;--r-l:22px;--r-m:16px;--r-s:12px;
  --sh:0 1px 2px rgba(27,42,94,.05),0 8px 24px -12px rgba(27,42,94,.18);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{font:500 15px/1.5 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-bottom:120px;min-height:100vh}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.soft{color:var(--soft)}.small{font-size:13px}

/* hero / top */
.hero{background:radial-gradient(120% 90% at 85% 0%,#34509f 0%,var(--plum) 55%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;border-radius:0 0 var(--r-xl) var(--r-xl);position:relative;overflow:hidden}
.hero .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{font-size:26px;font-weight:800;line-height:1.15}
.hero .date{color:#c9d6f5;font-size:14px;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pandan);box-shadow:0 0 0 3px rgba(34,176,125,.25)}
.sync.off i{background:var(--mango);box-shadow:0 0 0 3px rgba(255,182,39,.25)}
.top{background:var(--plum);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 20px;border-radius:0 0 var(--r-l) var(--r-l)}
.top .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h1{font-size:23px;font-weight:800}.top p{margin:3px 0 0;color:#c9d6f5;font-size:14px}

/* plate dial */
.plate{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;margin-top:16px}
.dial{position:relative;width:200px;height:200px}
.dial svg{width:100%;height:100%;overflow:visible}
.dial .arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.dial .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .ctr b{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}.dial .ctr span{font-size:12px;color:#c9d6f5;margin-top:4px}
.legend{display:grid;gap:9px}
.legend button{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-s);padding:8px 10px;color:#fff;text-align:left}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .t{flex:1;font-size:13px;line-height:1.2}.legend .v{font-size:13px;font-weight:700}
@media(max-width:380px){.plate{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* layout */
main section{padding:0 16px}
.card{background:var(--card);border-radius:var(--r-l);padding:18px;margin-top:14px;box-shadow:var(--sh)}
.card h2{font-size:17px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.link{border:0;background:none;color:var(--plum2);font-weight:700;font-size:13px;padding:0}

/* weight journey */
.wj{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wj .now{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}.wj .now small{font-size:16px;font-weight:600;color:var(--soft);margin-left:4px}
.delta{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:5px 10px;font-weight:700;font-size:13px}
.delta.dn{background:#e3f7ef;color:#13805a}.delta.up{background:#ffe9ea;color:#c4373b}
.track{position:relative;height:12px;border-radius:99px;background:#eaeef8;margin:16px 0 6px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--lilac),var(--pandan))}
.track em{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:4px solid var(--pandan);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.chart{width:100%;height:auto;display:block;margin-top:10px}

/* chips row */
.scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:14px -16px 0;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.qa{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:11px 16px 11px 12px;font-weight:700;font-size:14px;background:#fff;box-shadow:var(--sh)}
.qa span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;font-size:11px;line-height:1.25;color:var(--soft)}
.bdg .m{width:56px;height:56px;margin:0 auto 6px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:#eef1f8;filter:grayscale(1);opacity:.45}
.bdg.on{color:var(--ink);font-weight:600}.bdg.on .m{filter:none;opacity:1;background:linear-gradient(145deg,#fff3d1,#ffe0a3);box-shadow:inset 0 0 0 2px #ffcf6b}

/* appointment ticket */
.ticket{display:flex;align-items:stretch;border-radius:var(--r-m);overflow:hidden;background:linear-gradient(120deg,#e8eeff,#e6f6ff);margin-top:10px}
.ticket .d{background:var(--plum);color:#fff;width:70px;display:grid;place-content:center;text-align:center;padding:10px 0}
.ticket .d b{font-size:24px;line-height:1}.ticket .d span{font-size:12px;color:#c9d6f5}
.ticket .i{padding:11px 14px;flex:1}.ticket .i b{display:block;font-size:14px}.ticket .i span{font-size:12px;color:var(--soft)}
.ticket.past{opacity:.5}

/* date strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;margin:0 -16px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;border:0;border-radius:var(--r-m);padding:8px 0 9px;background:#fff;box-shadow:var(--sh);text-align:center}
.day small{display:block;font-size:11px;color:var(--soft);font-weight:600}.day b{display:block;font-size:18px;font-weight:800}
.day i{display:block;width:6px;height:6px;margin:3px auto 0;border-radius:50%;background:transparent}.day.has i{background:var(--pandan)}
.day.on{background:var(--plum);color:#fff}.day.on small{color:#c9d6f5}

/* meal tabs */
.mtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.mtab{border:0;background:#fff;border-radius:var(--r-m);padding:10px 2px 8px;box-shadow:var(--sh);font-size:11px;font-weight:600;color:var(--soft);position:relative;line-height:1.2}
.mtab .e{display:block;font-size:24px;margin-bottom:4px}
.mtab.ok::after{content:'';position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--pandan)}
.mtab.on{background:var(--plum);color:#fff;transform:translateY(-2px)}
textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 13px;background:#fafbff;font-weight:500}
textarea{resize:vertical;min-height:72px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--lilac);background:#fff;box-shadow:0 0 0 4px rgba(91,127,224,.15)}
.lbl{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}
.hunger{display:flex;align-items:center;gap:12px}
.hunger .face{width:52px;height:52px;flex:none;border-radius:16px;background:#edf2ff;display:grid;place-items:center;font-size:28px}
.hunger input{padding:0;border:0;background:none;box-shadow:none;-webkit-appearance:none;appearance:none;height:28px}
.hunger input::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--chilli) 0%,var(--mango) 18%,var(--pandan) 30%,var(--pandan) 62%,var(--mango) 74%,var(--chilli) 100%)}
.hunger input::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--chilli) 0%,var(--mango) 18%,var(--pandan) 30%,var(--pandan) 62%,var(--mango) 74%,var(--chilli) 100%)}
.hunger input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:5px solid var(--plum);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.hunger input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--plum)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:2px;padding-left:64px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-m);padding:10px 4px;font-size:12px;font-weight:600;color:var(--soft)}
.moods button .e{display:block;font-size:26px;margin-bottom:2px}
.moods button.on{border-color:var(--lilac);background:#ebf0ff;color:var(--plum2)}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.glass{width:34px;height:44px;border:0;background:none;padding:0}
.glass svg{width:100%;height:100%}
.tip{border-radius:var(--r-m);padding:12px 14px;font-size:13px;background:#eaf8f2;color:#145c43;margin-top:14px;display:flex;gap:10px;line-height:1.45}
.tip.warn{background:#fff4e0;color:#6b4300}.tip.care{background:#ebf0ff;color:#24387a}
.plateico{flex:none;width:38px;height:38px}

/* buttons */
.btn{border:0;border-radius:99px;padding:14px 18px;font-weight:700;background:#eaeef8;color:var(--ink)}
.btn.pri{background:var(--plum);color:#fff;box-shadow:0 10px 20px -10px rgba(27,42,94,.6)}
.btn.full{width:100%}.btn.sm{padding:8px 14px;font-size:13px}

/* exercise */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.week{display:flex;gap:6px;margin-top:14px;align-items:flex-end;height:74px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--soft);font-weight:600}
.week i{display:block;margin:0 auto 5px;width:100%;max-width:26px;border-radius:8px;background:#eaeef8}
.week .ok i{background:linear-gradient(180deg,var(--pandan),#19936a)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-m);padding:12px 4px 10px;font-size:12px;font-weight:600;color:var(--soft);line-height:1.2}
.acts button .e{display:block;font-size:24px;margin-bottom:4px}.acts button.on{border-color:var(--pandan);background:#eaf8f2;color:#13805a}
.seg{display:flex;background:#eaeef8;border-radius:99px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 0;font-weight:700;font-size:13px;color:var(--soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.mins{display:flex;gap:8px;flex-wrap:wrap}
.mins button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.mins button.on{background:var(--plum);border-color:var(--plum);color:#fff}
.done{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.done:first-child{border-top:0}
.done .e{width:42px;height:42px;border-radius:14px;background:#eaf8f2;display:grid;place-items:center;font-size:20px}
.done .x{border:0;background:#f3f6fc;border-radius:50%;width:32px;height:32px;color:var(--soft)}

/* reflection as coach chat */
.bubble{background:#fff;border-radius:6px var(--r-l) var(--r-l) var(--r-l);padding:13px 15px;box-shadow:var(--sh);margin:14px 0 8px;max-width:92%;font-weight:600}
.coach{display:flex;gap:10px;align-items:flex-start}.coach .av{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(145deg,var(--lilac),var(--plum2));display:grid;place-items:center;color:#fff;font-size:16px;margin-top:14px}
.ans{margin-left:44px}

/* list menu */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
details.g{border-top:1px solid var(--line)}details.g:first-of-type{border-top:0}
details.g summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 0;font-weight:700;cursor:pointer}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg);transition:transform .2s}
details.g[open] summary::after{transform:rotate(-135deg)}
details.g .body{padding:0 0 14px}
.ok-tag{font-size:11px;font-weight:700;color:#13805a;background:#e3f7ef;border-radius:99px;padding:2px 8px}

/* nav */
nav[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20;pointer-events:none}
nav .in{pointer-events:auto;display:flex;align-items:center;gap:2px;background:rgba(27,42,94,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;padding:7px;box-shadow:0 14px 30px -10px rgba(27,42,94,.6)}
nav button{border:0;background:none;color:#a7b6e0;width:58px;height:50px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff;background:rgba(255,255,255,.1)}
nav .plus{width:54px;height:54px;border-radius:19px;background:linear-gradient(145deg,var(--mango),#ff8f3a);color:var(--plum);margin:0 4px;box-shadow:0 8px 18px -6px rgba(255,143,58,.7)}
nav .plus svg{width:26px;height:26px}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,14,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:#d5dceb;margin:0 auto 14px}
.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheet .grid button{border:0;border-radius:var(--r-l);padding:16px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:10px}
.sheet .grid button span{font-size:28px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fd{from{opacity:0}}

/* login */
.login{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 70% at 80% 0%,#34509f,var(--plum) 60%);color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 30px;display:flex;flex-direction:column}
.login h1{font-size:36px;font-weight:800;line-height:1.05;margin-top:22px}
.login p{color:#c9d6f5}.login .box p{color:var(--soft)}.login .box b{color:var(--plum2)}
.login .box{background:#fff;color:var(--ink);border-radius:var(--r-l);padding:20px;margin-top:auto}
.code{font-size:26px;letter-spacing:6px;text-align:center;text-transform:uppercase;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
html.dark,body.dark{background:var(--plum)}html,body{overscroll-behavior-y:none}
.splash{position:fixed;inset:0;z-index:100;background:radial-gradient(110% 70% at 50% 35%,#34509f 0%,#1b2a5e 60%,#121d45 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .lg{position:relative;width:216px;height:216px;display:grid;place-items:center}
.splash .lg img{width:132px;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.splash .ring{position:absolute;inset:0;animation:spin 1.1s linear infinite}
.splash .ring2{position:absolute;inset:14px;animation:spin 2.2s linear infinite reverse;opacity:.5}
.splash h2{font-size:22px;font-weight:800;margin:22px 0 4px;letter-spacing:-.01em}.splash p{margin:0;color:#c9d6f5;font-size:13px}
.splash .jkn{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-size:12px;color:#a7b6e0}
@keyframes spin{to{transform:rotate(360deg)}}
.seg2{display:flex;gap:6px;background:#fff;border-radius:99px;padding:5px;box-shadow:var(--sh);margin-top:14px}
.seg2 button{flex:1;border:0;background:none;border-radius:99px;padding:10px 0;font-weight:700;font-size:13px;color:var(--soft)}
.seg2 button.on{background:var(--plum);color:#fff}
.chkl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.chkl:first-child{border-top:0}
.chkl .bx{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid #cfd8ea;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;transition:background .15s}
.chkl.on .bx{background:var(--pandan);border-color:var(--pandan)}
.chkl .tx{flex:1;font-weight:600;font-size:14px;line-height:1.35}.chkl .tx small{display:block;font-weight:500;color:var(--soft);font-size:12px}
.chkl.lock{opacity:.45}
.grp{font-size:12px;font-weight:700;color:var(--plum2);margin:14px 0 2px}
.phase{display:flex;gap:6px;margin-top:12px}.phase i{flex:1;height:8px;border-radius:99px;background:#e3e8f3}.phase i.done{background:var(--pandan)}.phase i.now{background:var(--mango)}
.back{border:0;background:rgba(255,255,255,.14);color:#fff;width:38px;height:38px;border-radius:12px;font-size:20px;margin-right:10px;flex:none}
.menu{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:var(--ink)}
.menu:first-of-type{border-top:0}.menu .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.menu .t{flex:1;font-weight:700}.menu .t small{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.menu::after{content:'';width:8px;height:8px;border-right:2px solid var(--soft);border-top:2px solid var(--soft);transform:rotate(45deg);margin-right:4px}
.stars{display:flex;gap:6px}.stars button{border:0;background:#f1f4fa;border-radius:12px;width:44px;height:44px;font-size:22px;filter:grayscale(1);opacity:.5}.stars button.on{filter:none;opacity:1;background:#fff4dc}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{width:100%;aspect-ratio:3/4;border-radius:var(--r-l);background:#eef2fa center/cover no-repeat;display:grid;place-items:center;color:var(--soft);font-weight:600;border:2px dashed #cfd8ea}
.hscale{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}.hscale span{height:8px;border-radius:3px}
.celebrate{background:linear-gradient(135deg,#1f9d6b,#2f4a9a);color:#fff;border-radius:var(--r-l);padding:20px;margin-top:14px;text-align:center}
.celebrate b{font-size:20px;display:block;margin:6px 0}
