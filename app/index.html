<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231942">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIMO Saya">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>MIMO Saya</title>
<style>
:root{
  --plum:#231942;--plum2:#3a2a6b;--ink:#1d1838;--soft:#6c6789;--line:#e8e5f3;--bg:#f5f3fb;--card:#fff;
  --pandan:#22b07d;--mango:#ffb627;--chilli:#ff5a5f;--lilac:#8e7dff;--sky:#3fa7f5;
  --r-xl:30px;--r-l:22px;--r-m:16px;--r-s:12px;
  --sh:0 1px 2px rgba(35,25,66,.05),0 8px 24px -12px rgba(35,25,66,.18);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}
body{font:500 15px/1.5 var(--f);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding-bottom:120px;min-height:100vh}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.soft{color:var(--soft)}.small{font-size:13px}

/* hero / top */
.hero{background:radial-gradient(120% 90% at 85% 0%,#4b3590 0%,var(--plum) 55%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;border-radius:0 0 var(--r-xl) var(--r-xl);position:relative;overflow:hidden}
.hero .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{font-size:26px;font-weight:800;line-height:1.15}
.hero .date{color:#cfc7f3;font-size:14px;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pandan);box-shadow:0 0 0 3px rgba(34,176,125,.25)}
.sync.off i{background:var(--mango);box-shadow:0 0 0 3px rgba(255,182,39,.25)}
.top{background:var(--plum);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 20px;border-radius:0 0 var(--r-l) var(--r-l)}
.top .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h1{font-size:23px;font-weight:800}.top p{margin:3px 0 0;color:#cfc7f3;font-size:14px}

/* plate dial */
.plate{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center;margin-top:16px}
.dial{position:relative;width:200px;height:200px}
.dial svg{width:100%;height:100%;overflow:visible}
.dial .arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.dial .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .ctr b{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}.dial .ctr span{font-size:12px;color:#cfc7f3;margin-top:4px}
.legend{display:grid;gap:9px}
.legend button{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-s);padding:8px 10px;color:#fff;text-align:left}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .t{flex:1;font-size:13px;line-height:1.2}.legend .v{font-size:13px;font-weight:700}
@media(max-width:380px){.plate{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* layout */
main section{padding:0 16px}
.card{background:var(--card);border-radius:var(--r-l);padding:18px;margin-top:14px;box-shadow:var(--sh)}
.card h2{font-size:17px;font-weight:700}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.link{border:0;background:none;color:var(--plum2);font-weight:700;font-size:13px;padding:0}

/* weight journey */
.wj{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wj .now{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}.wj .now small{font-size:16px;font-weight:600;color:var(--soft);margin-left:4px}
.delta{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:5px 10px;font-weight:700;font-size:13px}
.delta.dn{background:#e3f7ef;color:#13805a}.delta.up{background:#ffe9ea;color:#c4373b}
.track{position:relative;height:12px;border-radius:99px;background:#efedf7;margin:16px 0 6px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--lilac),var(--pandan))}
.track em{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:4px solid var(--pandan);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
.chart{width:100%;height:auto;display:block;margin-top:10px}

/* chips row */
.scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:14px -16px 0;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.qa{flex:none;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:11px 16px 11px 12px;font-weight:700;font-size:14px;background:#fff;box-shadow:var(--sh)}
.qa span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;font-size:11px;line-height:1.25;color:var(--soft)}
.bdg .m{width:56px;height:56px;margin:0 auto 6px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:#f0eef8;filter:grayscale(1);opacity:.45}
.bdg.on{color:var(--ink);font-weight:600}.bdg.on .m{filter:none;opacity:1;background:linear-gradient(145deg,#fff3d1,#ffe0a3);box-shadow:inset 0 0 0 2px #ffcf6b}

/* appointment ticket */
.ticket{display:flex;align-items:stretch;border-radius:var(--r-m);overflow:hidden;background:linear-gradient(120deg,#efeaff,#e6f6ff);margin-top:10px}
.ticket .d{background:var(--plum);color:#fff;width:70px;display:grid;place-content:center;text-align:center;padding:10px 0}
.ticket .d b{font-size:24px;line-height:1}.ticket .d span{font-size:12px;color:#cfc7f3}
.ticket .i{padding:11px 14px;flex:1}.ticket .i b{display:block;font-size:14px}.ticket .i span{font-size:12px;color:var(--soft)}
.ticket.past{opacity:.5}

/* date strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;margin:0 -16px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;border:0;border-radius:var(--r-m);padding:8px 0 9px;background:#fff;box-shadow:var(--sh);text-align:center}
.day small{display:block;font-size:11px;color:var(--soft);font-weight:600}.day b{display:block;font-size:18px;font-weight:800}
.day i{display:block;width:6px;height:6px;margin:3px auto 0;border-radius:50%;background:transparent}.day.has i{background:var(--pandan)}
.day.on{background:var(--plum);color:#fff}.day.on small{color:#cfc7f3}

/* meal tabs */
.mtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.mtab{border:0;background:#fff;border-radius:var(--r-m);padding:10px 2px 8px;box-shadow:var(--sh);font-size:11px;font-weight:600;color:var(--soft);position:relative;line-height:1.2}
.mtab .e{display:block;font-size:24px;margin-bottom:4px}
.mtab.ok::after{content:'';position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--pandan)}
.mtab.on{background:var(--plum);color:#fff;transform:translateY(-2px)}
textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);padding:12px 13px;background:#fbfaff;font-weight:500}
textarea{resize:vertical;min-height:72px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--lilac);background:#fff;box-shadow:0 0 0 4px rgba(142,125,255,.15)}
.lbl{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}
.hunger{display:flex;align-items:center;gap:12px}
.hunger .face{width:52px;height:52px;flex:none;border-radius:16px;background:#f3f0ff;display:grid;place-items:center;font-size:28px}
.hunger input{padding:0;border:0;background:none;box-shadow:none;-webkit-appearance:none;appearance:none;height:28px}
.hunger input::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--chilli),var(--mango),var(--pandan),var(--sky),var(--lilac))}
.hunger input::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--chilli),var(--mango),var(--pandan),var(--sky),var(--lilac))}
.hunger input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:5px solid var(--plum);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.hunger input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--plum)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:2px;padding-left:64px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-m);padding:10px 4px;font-size:12px;font-weight:600;color:var(--soft)}
.moods button .e{display:block;font-size:26px;margin-bottom:2px}
.moods button.on{border-color:var(--lilac);background:#f1eeff;color:var(--plum2)}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.glass{width:34px;height:44px;border:0;background:none;padding:0}
.glass svg{width:100%;height:100%}
.tip{border-radius:var(--r-m);padding:12px 14px;font-size:13px;background:#eaf8f2;color:#145c43;margin-top:14px;display:flex;gap:10px;line-height:1.45}
.tip.warn{background:#fff4e0;color:#6b4300}.tip.care{background:#f1eeff;color:#3b2d78}
.plateico{flex:none;width:38px;height:38px}

/* buttons */
.btn{border:0;border-radius:99px;padding:14px 18px;font-weight:700;background:#efedf7;color:var(--ink)}
.btn.pri{background:var(--plum);color:#fff;box-shadow:0 10px 20px -10px rgba(35,25,66,.6)}
.btn.full{width:100%}.btn.sm{padding:8px 14px;font-size:13px}

/* exercise */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:92px;height:92px;flex:none}
.week{display:flex;gap:6px;margin-top:14px;align-items:flex-end;height:74px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--soft);font-weight:600}
.week i{display:block;margin:0 auto 5px;width:100%;max-width:26px;border-radius:8px;background:#efedf7}
.week .ok i{background:linear-gradient(180deg,var(--pandan),#19936a)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-m);padding:12px 4px 10px;font-size:12px;font-weight:600;color:var(--soft);line-height:1.2}
.acts button .e{display:block;font-size:24px;margin-bottom:4px}.acts button.on{border-color:var(--pandan);background:#eaf8f2;color:#13805a}
.seg{display:flex;background:#efedf7;border-radius:99px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 0;font-weight:700;font-size:13px;color:var(--soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.mins{display:flex;gap:8px;flex-wrap:wrap}
.mins button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.mins button.on{background:var(--plum);border-color:var(--plum);color:#fff}
.done{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.done:first-child{border-top:0}
.done .e{width:42px;height:42px;border-radius:14px;background:#eaf8f2;display:grid;place-items:center;font-size:20px}
.done .x{border:0;background:#f5f3fb;border-radius:50%;width:32px;height:32px;color:var(--soft)}

/* reflection as coach chat */
.bubble{background:#fff;border-radius:6px var(--r-l) var(--r-l) var(--r-l);padding:13px 15px;box-shadow:var(--sh);margin:14px 0 8px;max-width:92%;font-weight:600}
.coach{display:flex;gap:10px;align-items:flex-start}.coach .av{width:34px;height:34px;flex:none;border-radius:50%;background:linear-gradient(145deg,var(--lilac),var(--plum2));display:grid;place-items:center;color:#fff;font-size:16px;margin-top:14px}
.ans{margin-left:44px}

/* list menu */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
details.g{border-top:1px solid var(--line)}details.g:first-of-type{border-top:0}
details.g summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 0;font-weight:700;cursor:pointer}
details.g summary::-webkit-details-marker{display:none}
details.g summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(45deg);transition:transform .2s}
details.g[open] summary::after{transform:rotate(-135deg)}
details.g .body{padding:0 0 14px}
.ok-tag{font-size:11px;font-weight:700;color:#13805a;background:#e3f7ef;border-radius:99px;padding:2px 8px}

/* nav */
nav[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20;pointer-events:none}
nav .in{pointer-events:auto;display:flex;align-items:center;gap:2px;background:rgba(35,25,66,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;padding:7px;box-shadow:0 14px 30px -10px rgba(35,25,66,.6)}
nav button{border:0;background:none;color:#a9a0d6;width:58px;height:50px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff;background:rgba(255,255,255,.1)}
nav .plus{width:54px;height:54px;border-radius:19px;background:linear-gradient(145deg,var(--mango),#ff8f3a);color:var(--plum);margin:0 4px;box-shadow:0 8px 18px -6px rgba(255,143,58,.7)}
nav .plus svg{width:26px;height:26px}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,14,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:99px;background:#dcd8ea;margin:0 auto 14px}
.sheet .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sheet .grid button{border:0;border-radius:var(--r-l);padding:16px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:10px}
.sheet .grid button span{font-size:28px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fd{from{opacity:0}}

/* login */
.login{min-height:100vh;background:radial-gradient(120% 70% at 80% 0%,#4b3590,var(--plum) 60%);color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 30px;display:flex;flex-direction:column}
.login h1{font-size:36px;font-weight:800;line-height:1.05;margin-top:22px}
.login p{color:#cfc7f3}.login .box p{color:var(--soft)}.login .box b{color:var(--plum2)}
.login .box{background:#fff;color:var(--ink);border-radius:var(--r-l);padding:20px;margin-top:auto}
.code{font-size:26px;letter-spacing:6px;text-align:center;text-transform:uppercase;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav" hidden><div class="in">
  <button data-v="utama" class="on" aria-label="Utama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Utama</button>
  <button data-v="makan" aria-label="Makan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Makan</button>
  <button class="plus" id="plus" aria-label="Catat pantas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="senaman" aria-label="Gerak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4a1.5 1.5 0 1 0 0 .01M7 21l3-6 3 2v4M10 15l1-5 4 3 3-1M8 11l3-1"/></svg>Gerak</button>
  <button data-v="lagi" aria-label="Saya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Saya</button>
</div></nav>
<script>
/* ======================= KONFIGURASI ======================= */
var API_URL = '';   // URL Web App Apps Script (…/exec). Kosong = MOD DEMO
/* =========================================================== */
</script>
<script>/* ===== SKEMA LAJUR KKM MIMO (202 lajur, susunan ikut data sebenar sheet KKM) =====
 * Jika susunan sheet KKM berubah, ubah di sini sahaja.
 * NOTA: Bagi BASELINE, data sebenar KKM meletakkan Komposisi Tubuh (lajur 26-29) SEBELUM
 * ujian makmal, walaupun tajuk sheet menunjukkan sebaliknya. Susunan di bawah ikut DATA.
 * Bagi 6 BULAN / 12 BULAN tiada data untuk disemak — susunan ikut TAJUK sheet.
 */
var YT = ['YA', 'TIDAK'];
var ST = ['SELESAI', 'TIDAK DILAKUKAN'];
var KKM_SCHEMA = (function () {
  var c = [];
  function A(k, l, g, o, t) { c.push({ k: k, l: l, g: g, o: o || null, t: t || 'text' }); }
  // --- Maklumat fasiliti / rujukan / pesakit (0-17)
  A('NEGERI', 'Negeri', 'Fasiliti', ['KEDAH']);
  A('DAERAH', 'Daerah', 'Fasiliti', ['KOTA SETAR', 'KUBANG PASU', 'PADANG TERAP', 'POKOK SENA', 'PENDANG', 'YAN', 'KUALA MUDA', 'SIK', 'BALING', 'KULIM', 'BANDAR BAHARU', 'LANGKAWI']);
  A('FASILITI', 'Fasiliti', 'Fasiliti');
  A('SUMBER_RUJUKAN', 'Sumber rujukan', 'Rujukan', ['KLINIK KESIHATAN', 'HOSPITAL', 'KOSPEN', 'SARINGAN KOMUNITI', 'LAIN-LAIN']);
  A('SUMBER_RUJUKAN_2', 'Sumber rujukan (perincian)', 'Rujukan');
  A('STATUS_RUJUKAN', 'Status rujukan', 'Rujukan', ['SETUJU SERTAI MIMO', 'TIDAK SETUJU SERTAI MIMO']);
  A('NAMA', 'Nama', 'Pesakit');
  A('NOKP', 'No. KP / Polis / Tentera', 'Pesakit');
  A('TARIKH_LAHIR', 'Tarikh lahir (DD/MM/YYYY)', 'Pesakit', null, 'date');
  A('UMUR', 'Umur', 'Pesakit', null, 'num');
  A('BANGSA', 'Bangsa', 'Pesakit', ['MELAYU', 'CINA', 'INDIA', 'BUMIPUTERA SABAH', 'BUMIPUTERA SARAWAK', 'ORANG ASLI', 'LAIN-LAIN']);
  A('JANTINA', 'Jantina', 'Pesakit', ['LELAKI', 'PEREMPUAN']);
  A('TELEFON', 'No. telefon', 'Pesakit');
  A('SP_DM', 'Diabetes', 'Sejarah perubatan', YT);
  A('SP_HPT', 'Hipertensi', 'Sejarah perubatan', YT);
  A('SP_DLP', 'Dislipidemia', 'Sejarah perubatan', YT);
  A('SP_CVD', 'Penyakit kardiovaskular', 'Sejarah perubatan', YT);
  A('SP_LAIN', 'Lain-lain', 'Sejarah perubatan');

  var w = mingguIso(hariIni()), l = getLog('REFLEKSI', w), d = l ? l.data : {};
  var kenyang = {}, emo = {};
  mingguIni().forEach(function (x) { var m = getLog('MAKAN', x); if (!m) return; Object.keys(m.data.hidangan || {}).forEach(function (k) { var h = m.data.hidangan[k]; if (num(h.lapar) >= 7) kenyang[k] = (kenyang[k] || 0) + 1; if (h.mood) emo[h.mood] = (emo[h.mood] || 0) + 1; }); });
  var kTop = Object.keys(kenyang).sort(function (a, b) { return kenyang[b] - kenyang[a]; })[0], eTop = Object.keys(emo).sort(function (a, b) { return emo[b] - emo[a]; }).slice(0, 2);
  var nama = {}; WAKTU.forEach(function (x) { nama[x[0]] = x[1].toLowerCase(); });
  var lama = Object.keys(ST.logs || {}).filter(function (k) { return k.indexOf('REFLEKSI|') === 0 && k !== 'REFLEKSI|' + w; }).sort().reverse();
  var Q = [['q1', 'Pada waktu bila saya paling kerap makan walaupun tidak lapar (skala 7 hingga 10)?', kTop ? 'Dari catatan anda, paling kerap semasa ' + nama[kTop] + '.' : ''],
    ['q2', 'Emosi apa yang paling banyak membuat saya terlebih makan minggu ini?', eTop.length ? 'Paling kerap dicatat: ' + eTop.join(', ') + '.' : ''],
    ['q3', 'Apa satu tindakan lain yang boleh saya buat minggu depan selain makan, bila emosi itu datang?', '']];
  $('#app').innerHTML = topBar('Refleksi mingguan', 'Minggu ' + (+w.split('-W')[1]) + ', ' + w.split('-')[0]) + '<main><section>' +
    Q.map(function (q) { return '<div class="coach"><div class="av">🌿</div><div class="bubble">' + q[1] + (q[2] ? '<div class="small" style="font-weight:500;color:var(--plum2);margin-top:6px">💡 ' + esc(q[2]) + '</div>' : '') + '</div></div><div class="ans"><textarea id="' + q[0] + '" rows="2" placeholder="Tulis jawapan anda…">' + esc(d[q[0]]) + '</textarea></div>'; }).join('') +
    '<div style="height:14px"></div><button class="btn pri full" id="rS">Simpan refleksi</button>' +
    (lama.length ? '<div class="card"><h2>Refleksi lepas</h2>' + lama.slice(0, 8).map(function (k) { var x = ST.logs[k].data; return '<details class="g"><summary>Minggu ' + (+k.split('-W')[1]) + ', ' + k.split('|')[1].slice(0, 4) + '</summary><div class="body small soft">' + esc(x.q1) + '<br>' + esc(x.q2) + '<br>' + esc(x.q3) + '</div></details>'; }).join('') + '</div>' : '') +
    '<div class="tip care">💜<div>Jika anda rasa tertekan, sedih berpanjangan atau sukar mengawal emosi, beritahu petugas MIMO atau hubungi <b>Talian HEAL 15555</b>. Kecemasan: <b>999</b>.</div></div></section></main>';
  $('#rS').onclick = function () { setLog('REFLEKSI', w, { q1: $('#q1').value.trim(), q2: $('#q2').value.trim(), q3: $('#q3').value.trim() }); toast('✍️ Refleksi disimpan'); };
}

/* ---------- Saya ---------- */

function vLagi() {

  $('#app').innerHTML = topBar(esc(P.nama || 'Saya'), esc(P.fasiliti || '')) + '<main><section>' +
    '<div class="card"><div class="head"><h2>Temujanji</h2><span class="small soft">' + dpn.length + ' akan datang</span></div>' + (dpn.length ? dpn.map(tiket).join('') : '<p class="small soft" style="margin:0">Tiada temujanji akan datang.</p>') +

    '<div class="card"><button class="row" style="width:100%;border:0;background:none;padding:0;text-align:left" onclick="go(\'refleksi\')"><span class="ic" style="background:#ffe9ea">✍️</span><span style="flex:1"><b>Refleksi mingguan</b><br><span class="small soft">3 soalan ringkas tentang minggu ini</span></span>' + (getLog('REFLEKSI', mingguIso(hariIni())) ? '<span class="ok-tag">Selesai</span>' : '') + '</button></div>' +
    '<div class="card"><details class="g" id="fifot"><summary><span class="row" style="padding:0;border:0"><span class="ic" style="background:#f1eeff">🧭</span><span>Strategi perubahan diet<br><span class="small soft" style="font-weight:500">Halangan, punca dan strategi saya</span></span></span></summary><div class="body">' +
    FIFOT.map(function (f) { var r = rows[f[0]] || {}; return '<div style="margin-top:12px"><b>' + f[1] + '</b> ' + (r.strategi ? '<span class="ok-tag">✓</span>' : '') + '<div class="small soft">' + f[2] + '</div>' +
      [['halangan', 'Halangan'], ['punca', 'Punca'], ['strategi', 'Strategi saya']].map(function (x) { return '<label class="lbl" style="margin:10px 0 6px;font-size:12px">' + x[1] + '</label><textarea rows="2" data-r="' + f[0] + '" data-c="' + x[0] + '">' + esc(r[x[0]]) + '</textarea>'; }).join('') + '</div>'; }).join('') +
    '<div class="tip">💡<div><b>Contoh:</b> Halangan kerap makan lewat malam. Puncanya balik kerja penat, skip makan malam dan terus tonton TV. Strategi: sediakan meal prep sedia dipanaskan dan tukar snek kepada buah potong.</div></div><div style="height:12px"></div><button class="btn pri full" id="fS">Simpan strategi</button></div></details>' +
    '<details class="g"><summary><span class="row" style="padding:0;border:0"><span class="ic" style="background:#e3f7ef">👟</span><span>Sebelum bersenam<br><span class="small soft" style="font-weight:500">Pakaian, kasut, makan dan minum</span></span></span></summary><div class="body small">' +
    '<p><b>Pakaian.</b> Longgar, selesa dan menyerap peluh supaya badan mudah bergerak dan tidak terlalu panas.</p><p><b>Kasut.</b> Kasut sukan bertapak empuk yang muat, dengan stokin. Elakkan selipar supaya buku lali disokong.</p>' +
    '<p><b>Makan dan minum.</b> Makan ringan 1 hingga 2 jam sebelum bersenam. Minum air sebelum, semasa dan selepas. Jika anda mengambil insulin atau ubat diabetes, bawa gula-gula sekiranya gula darah turun.</p><p style="margin-bottom:0"><b>Panaskan badan.</b> Mulakan dengan 5 hingga 10 minit regangan atau jalan perlahan, dan akhiri dengan 5 minit menyejukkan badan.</p></div></details></div>' +
    '<div class="tip care">💜<div>Perlu sokongan emosi? Hubungi petugas MIMO anda atau <b>Talian HEAL 15555</b>. Kecemasan: <b>999</b>.</div></div>' +
    '<div class="card"><h2>Tetapan</h2><p class="small soft">Kali terakhir disegerak: ' + (ST.lastSync ? new Date(ST.lastSync).toLocaleString('ms-MY') : 'belum') + '<br>Belum dihantar: ' + dirtyN() + ' catatan</p>' +
    '<button class="btn full" id="sgk">Segerak sekarang</button><div style="height:8px"></div><button class="btn full" style="color:var(--chilli)" onclick="keluar()">Log keluar dan padam data dari telefon ini</button>' +
    '<p class="small soft" style="margin-bottom:0">Pasang di skrin utama: buka menu pelayar, kemudian pilih "Add to Home Screen" atau "Tambah ke Skrin Utama".</p></div></section></main>';
  $('#fS').onclick = function () { $$('[data-r]').forEach(function (t) { rows[t.dataset.r] = rows[t.dataset.r] || {}; rows[t.dataset.r][t.dataset.c] = t.value.trim(); }); setLog('STRATEGI', 'FIFOT', { rows: rows }); toast('🧭 Strategi disimpan'); };
  $('#sgk').onclick = function () { sync().then(function () { toast('Disegerak'); vLagi(); }); };
}
